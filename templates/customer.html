<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Kunden – Nummer ziehen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            text-align: center;
            width: 380px;
        }
        h1 {
            font-weight: 600;
            font-size: 34px;
            margin-bottom: 10px;
        }
        .number {
            font-size: 70px;
            font-weight: 700;
            color: #2d6cdf;
            margin: 20px 0 40px 0;
        }
        button {
            background: #2d6cdf;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        button:hover {
            background: #1f51b4;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Aktuell an der Reihe</h1>
        <div class="number">{{ current_number }}</div>

        <a href="/take_number">
            <button>Nummer ziehen</button>
        </a>
    </div>
</body>
</html>
