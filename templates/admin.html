<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin – Warteschlange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #eef1f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            text-align: center;
            width: 420px;
        }
        h1 {
            font-weight: 600;
            font-size: 32px;
            margin-bottom: 6px;
        }
        h2 {
            font-weight: 400;
            color: #555;
            margin-bottom: 30px;
        }
        .current {
            font-size: 70px;
            font-weight: 700;
            color: #0f9900;
            margin: 0 0 40px 0;
        }
        button {
            background: #2d6cdf;
            color: white;
            border: none;
            padding: 16px 26px;
            font-size: 20px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin: 12px 0;
            transition: 0.2s;
        }
        button:hover {
            background: #1f51b4;
        }
        .secondary {
            background: #e1e5eb;
            color: #000;
        }
        .secondary:hover {
            background: #c8ccd3;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Aktuell bedient</h1>
        <div class="current">{{ current_number }}</div>

        <h2>Nächster Kunde: {{ next_customer_number }}</h2>
        <p style="color:#888; font-size:14px;">(Nächste freie Nummer: {{ next_free_number }})</p>


        <a href="/next_customer">
            <button>Nächster Kunde</button>
        </a>

    <form action="{{ url_for('admin_take_number') }}">
    <button type="submit">Nummer ziehen</button>
    </form>
    </div>
</body>
</html>
