<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Deine Nummer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Inter", sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            text-align: center;
            width: 380px;
            animation: fadeIn 0.4s ease;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        .ticket-number {
            font-size: 80px;
            font-weight: 700;
            color: #2d6cdf;
            margin: 20px 0;
        }
        a button {
            background: #2d6cdf;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            border: none;
            font-size: 20px;
            cursor: pointer;
            width: 100%;
        }
        a button:hover {
            background: #1f51b4;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Deine Nummer</h1>
    <div class="ticket-number">{{ ticket }}</div>
</div>

</body>
</html>
